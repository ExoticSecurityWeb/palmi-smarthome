<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Palmi Smart Home</title>

<style>
:root {
    --brown: rgba(55, 36, 25, .72);
    --brown-light: rgba(85, 56, 39, .55);
    --border: rgba(255,235,215,.18);
    --text: #fff8f0;
    --muted: #d8c7b8;
    --accent: #d7a56f;
    --green: #8ed6a0;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    background: #241711;
    overflow-x: hidden;
}

.background {
    position: fixed;
    inset: 0;
    background:
        linear-gradient(
            180deg,
            rgba(35,22,16,.18),
            rgba(35,22,16,.62)
        ),
        url("background.jpg") center / cover no-repeat;
    z-index: -2;
}

.overlay {
    position: fixed;
    inset: 0;
    background:
        linear-gradient(
            120deg,
            rgba(39,24,17,.45),
            rgba(39,24,17,.08),
            rgba(39,24,17,.38)
        );
    z-index: -1;
}

.container {
    width: min(1180px,100%);
    margin: auto;
    padding: 28px 20px 50px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 25px;
}

.logo {
    font-size: clamp(27px,4vw,42px);
    font-weight: 750;
    letter-spacing: -1px;
}

.subtitle {
    margin-top: 4px;
    color: var(--muted);
}

.status {
    padding: 9px 15px;
    border: 1px solid var(--border);
    background: var(--brown);
    backdrop-filter: blur(18px);
    border-radius: 999px;
    font-size: 14px;
    white-space: nowrap;
}

.status-dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    margin-right: 7px;
    background: var(--green);
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(142,214,160,.7);
}

.grid {
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 18px;
}

.card {
    padding: 22px;
    border: 1px solid var(--border);
    border-radius: 24px;
    background: linear-gradient(
        145deg,
        var(--brown),
        var(--brown-light)
    );
    backdrop-filter: blur(18px);
    box-shadow: 0 18px 50px rgba(20,10,5,.25);
}

.card-wide {
    grid-column: 1 / -1;
}

.card-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.card-title h2 {
    margin: 0;
    font-size: 18px;
}

.card-icon {
    font-size: 23px;
}

.rows {
    display: grid;
    gap: 10px;
}

.row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding: 13px 14px;
    border: 1px solid rgba(255,255,255,.08);
    background: rgba(255,255,255,.055);
    border-radius: 15px;
}

.row-title {
    font-weight: 500;
}

.row-subtitle {
    margin-top: 2px;
    color: var(--muted);
    font-size: 13px;
}

button {
    border: 1px solid rgba(255,255,255,.10);
    color: var(--text);
    background: rgba(255,255,255,.09);
    border-radius: 12px;
    padding: 10px 14px;
    cursor: pointer;
    font-size: 16px;
    transition: .18s ease;
}

button:hover {
    background: rgba(215,165,111,.25);
    transform: translateY(-1px);
}

button:active {
    transform: scale(.96);
}

button:disabled {
    opacity: .4;
    cursor: not-allowed;
}

.button-active {
    color: #ffe3bd;
    background: rgba(215,165,111,.18);
    border-color: rgba(215,165,111,.35);
}

.remote {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 9px;
    max-width: 360px;
    margin: auto;
}

.remote button {
    height: 48px;
}

.empty {
    visibility: hidden;
}

.temperature {
    font-size: 31px;
    font-weight: 700;
}

.weather-main {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 15px;
}

.weather-icon {
    width: 64px;
    height: 64px;
}

.weather-description {
    color: var(--muted);
    text-transform: capitalize;
}

.weather-grid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 10px;
}

.weather-item {
    padding: 12px;
    border-radius: 14px;
    background: rgba(255,255,255,.055);
    text-align: center;
}

.weather-value {
    font-size: 20px;
    font-weight: 650;
}

.weather-label {
    color: var(--muted);
    font-size: 12px;
    margin-top: 3px;
}

.system-online {
    color: #4ade80;
}

.system-offline {
    color: #ef4444;
}

@media (max-width: 760px) {
    .grid {
        grid-template-columns: 1fr;
    }

    .card-wide {
        grid-column: auto;
    }

    .header {
        align-items: flex-start;
        flex-direction: column;
    }

    .weather-grid {
        grid-template-columns: 1fr 1fr 1fr;
    }
}
</style>
</head>

<body>

<div class="background"></div>
<div class="overlay"></div>

<div class="container">

<header class="header">
    <div>
        <div class="logo">🌴 Palmi Smart Home</div>
        <div class="subtitle">
            Contrôle de la caravane connectée
        </div>
    </div>

    <div class="status">
        <span
            id="headerStatusDot"
            class="status-dot"
        ></span>

        <span id="headerStatusText">
            Vérification...
        </span>
    </div>
</header>

<main class="grid">

    <!-- 💡 LUMIÈRE -->

    <section class="card">
        <div class="card-title">
            <h2>💡 Lumière</h2>
            <span class="card-icon">💡</span>
        </div>

        <div class="rows">

            <div class="row">
                <div>
                    <div class="row-title">
                        État
                    </div>

                    <div
                        class="row-subtitle"
                        id="lightState"
                    >
                        Chargement...
                    </div>
                </div>

                <button
                    id="lightButton"
                    onclick="toggleLight()"
                >
                    ON / OFF
                </button>
            </div>

            <div class="row">
                <div>
                    <div class="row-title">
                        Luminosité
                    </div>

                    <div
                        class="row-subtitle"
                        id="brightness"
                    >
                        50 %
                    </div>
                </div>

                <div>
                    <button
                        onclick="changeBrightness(-10)"
                    >
                        −
                    </button>

                    <button
                        onclick="changeBrightness(10)"
                    >
                        +
                    </button>
                </div>
            </div>

        </div>
    </section>


    <!-- 🌦️ MÉTÉO -->

    <section class="card">
        <div class="card-title">
            <h2>🌦️ Météo</h2>
            <span class="card-icon">☁️</span>
        </div>

        <div class="weather-main">

            <img
                id="weatherIcon"
                class="weather-icon"
                alt=""
            >

            <div>
                <div>
                    <span
                        id="weatherTemp"
                        class="temperature"
                    >
                        --
                    </span>
                    °C
                </div>

                <div
                    id="weatherDescription"
                    class="weather-description"
                >
                    Chargement...
                </div>
            </div>

        </div>

        <div class="weather-grid">

            <div class="weather-item">
                <div
                    id="weatherFeels"
                    class="weather-value"
                >
                    --
                </div>

                <div class="weather-label">
                    Ressenti °C
                </div>
            </div>

            <div class="weather-item">
                <div
                    id="weatherHumidity"
                    class="weather-value"
                >
                    --
                </div>

                <div class="weather-label">
                    Humidité %
                </div>
            </div>

            <div class="weather-item">
                <div
                    id="weatherWind"
                    class="weather-value"
                >
                    --
                </div>

                <div class="weather-label">
                    Vent km/h
                </div>
            </div>

        </div>
    </section>


    <!-- 📺 TV -->

    <section class="card card-wide">

        <div class="card-title">
            <h2>📺 TV 1 — Google TV Stick</h2>
            <span class="card-icon">📺</span>
        </div>

        <div class="remote">

            <button
                class="empty"
                disabled
            >
            </button>

            <button
                onclick="tv(1,'up')"
            >
                ▲
            </button>

            <button
                class="empty"
                disabled
            >
            </button>


            <button
                onclick="tv(1,'left')"
            >
                ◀
            </button>

            <button
                onclick="tv(1,'ok')"
            >
                OK
            </button>

            <button
                onclick="tv(1,'right')"
            >
                ▶
            </button>


            <button
                onclick="tv(1,'back')"
            >
                ↩
            </button>

            <button
                onclick="tv(1,'down')"
            >
                ▼
            </button>

            <button
                onclick="tv(1,'home')"
            >
                🏠
            </button>


            <button
                onclick="tv(1,'volume_down')"
            >
                🔉
            </button>

            <button
                onclick="tv(1,'mute')"
            >
                🔇
            </button>

            <button
                onclick="tv(1,'volume_up')"
            >
                🔊
            </button>


            <button
                onclick="tv(1,'power')"
            >
                ⏻
            </button>

        </div>

    </section>


    <!-- 🏠 SYSTÈME -->

    <section class="card card-wide">

        <div class="card-title">
            <h2>🏠 Système</h2>
            <span class="card-icon">🌴</span>
        </div>

        <div class="row">

            <div>
                <div class="row-title">
                    Palmi Smart Home
                </div>

                <div class="row-subtitle">
                    État général du système
                </div>
            </div>

            <div
                id="generalStatusText"
            >
                ● Vérification...
            </div>

        </div>

    </section>

</main>

</div>
<script>

/*
============================================================
🌴 PALMI SMART HOME
JavaScript du dashboard

IMPORTANT :
Le CSS est fermé AVANT ce script.
Cela évite qu'une erreur de structure transforme
le dashboard en simple fond marron.
============================================================
*/

let lightOn = false;
let brightness = 50;


/* ============================================================
   💡 LUMIÈRE
   ============================================================ */

async function loadLightStatus() {

    try {

        const response =
            await fetch("/light/status");

        const data =
            await response.json();

        if (
            !response.ok ||
            data.success === false
        ) {
            return;
        }

        lightOn =
            Boolean(data.on);

        if (
            typeof data.brightness === "number"
        ) {
            brightness =
                data.brightness;
        }

        updateLight();

        const brightnessElement =
            document.getElementById(
                "brightness"
            );

        if (brightnessElement) {

            brightnessElement.textContent =
                brightness + " %";

        }

    } catch (error) {

        console.log(
            "Erreur lumière :",
            error
        );

    }

}


async function toggleLight() {

    const endpoint =
        lightOn
            ? "/light/off"
            : "/light/on";

    try {

        const response =
            await fetch(endpoint);

        const data =
            await response.json();

        if (
            !response.ok ||
            data.success === false
        ) {

            alert(
                "Impossible de contrôler la lumière."
            );

            return;
        }

        lightOn =
            !lightOn;

        updateLight();

    } catch (error) {

        alert(
            "Erreur de connexion au serveur."
        );

    }

}


function updateLight() {

    const button =
        document.getElementById(
            "lightButton"
        );

    const state =
        document.getElementById(
            "lightState"
        );

    if (!button || !state) {
        return;
    }

    button.classList.toggle(
        "button-active",
        lightOn
    );

    state.textContent =
        lightOn
            ? "Allumée"
            : "Éteinte";

}


async function changeBrightness(amount) {

    const newBrightness =
        Math.max(
            0,
            Math.min(
                100,
                brightness + amount
            )
        );

    try {

        const response =
            await fetch(
                "/light/brightness",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            brightness:
                                newBrightness
                        })
                }
            );

        const data =
            await response.json();

        if (
            !response.ok ||
            data.success === false
        ) {
            return;
        }

        brightness =
            newBrightness;

        const element =
            document.getElementById(
                "brightness"
            );

        if (element) {

            element.textContent =
                brightness + " %";

        }

    } catch (error) {

        console.log(
            "Erreur luminosité :",
            error
        );

    }

}


/* ============================================================
   📺 TV
   Dashboard → Railway → Worker → A10 → TV
   ============================================================ */

async function tv(number, action) {

    if (number !== 1) {
        return;
    }

    try {

        const response =
            await fetch(
                `/tv/${number}/${action}`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            count: 1
                        })
                }
            );

        const data =
            await response.json();

        if (
            !response.ok ||
            data.success === false
        ) {

            console.error(
                "Commande TV refusée :",
                data
            );

            return;
        }

        console.log(
            "📺 TV 1 commande envoyée :",
            action
        );

    } catch (error) {

        console.error(
            "Erreur commande TV :",
            error
        );

    }

}


/* ============================================================
   🌦️ MÉTÉO
   ============================================================ */

async function loadWeather() {

    const description =
        document.getElementById(
            "weatherDescription"
        );

    if (!description) {
        return;
    }

    description.textContent =
        "Chargement...";

    try {

        const response =
            await fetch("/weather");

        const data =
            await response.json();

        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Erreur météo"
            );

        }

        const temp =
            document.getElementById(
                "weatherTemp"
            );

        const feels =
            document.getElementById(
                "weatherFeels"
            );

        const humidity =
            document.getElementById(
                "weatherHumidity"
            );

        const wind =
            document.getElementById(
                "weatherWind"
            );

        const icon =
            document.getElementById(
                "weatherIcon"
            );

        if (temp) {
            temp.textContent =
                data.temperature;
        }

        if (feels) {
            feels.textContent =
                data.feelsLike;
        }

        if (humidity) {
            humidity.textContent =
                data.humidity;
        }

        if (wind) {
            wind.textContent =
                data.wind;
        }

        description.textContent =
            data.description;

        if (
            icon &&
            data.icon
        ) {

            icon.src =
                `https://openweathermap.org/img/wn/${data.icon}@2x.png`;

        }

    } catch (error) {

        console.error(
            "Erreur météo :",
            error
        );

        description.textContent =
            "Météo indisponible";

    }

}


/* ============================================================
   🏠 ÉTAT DU SYSTÈME
   ============================================================ */

async function checkSystemStatus() {

    const dot =
        document.getElementById(
            "headerStatusDot"
        );

    const headerText =
        document.getElementById(
            "headerStatusText"
        );

    const generalText =
        document.getElementById(
            "generalStatusText"
        );

    try {

        const response =
            await fetch(
                "/light/status"
            );

        const data =
            await response.json();

        if (
            !response.ok ||
            data.success === false
        ) {

            throw new Error(
                "Système indisponible"
            );

        }

        if (dot) {

            dot.style.background =
                "#4ade80";

        }

        if (headerText) {

            headerText.textContent =
                "Système en ligne";

        }

        if (generalText) {

            generalText.textContent =
                "● En ligne";

            generalText.className =
                "system-online";

        }

    } catch (error) {

        if (dot) {

            dot.style.background =
                "#ef4444";

        }

        if (headerText) {

            headerText.textContent =
                "Système hors ligne";

        }

        if (generalText) {

            generalText.textContent =
                "● Hors ligne";

            generalText.className =
                "system-offline";

        }

    }

}


/* ============================================================
   🚀 DÉMARRAGE
   ============================================================ */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        loadWeather();

        loadLightStatus();

        checkSystemStatus();

    }
);


/*
============================================================
🔄 ACTUALISATION AUTOMATIQUE
============================================================
*/

setInterval(
    loadLightStatus,
    10000
);

setInterval(
    checkSystemStatus,
    30000
);

setInterval(
    loadWeather,
    300000
);


/*
============================================================
🛡️ PROTECTION
============================================================

Si une fonction JavaScript rencontre une erreur,
le dashboard reste affiché.
============================================================
*/

window.addEventListener(
    "error",
    event => {

        console.error(
            "Erreur dashboard :",
            event.error || event.message
        );

    }
);

window.addEventListener(
    "unhandledrejection",
    event => {

        console.error(
            "Erreur Promise dashboard :",
            event.reason
        );

    }
);

</script>

</body>
</html>
