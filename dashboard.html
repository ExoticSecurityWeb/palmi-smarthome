<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palmi Smart Home</title>

<style>
:root {
    --brown: rgba(55, 36, 25, .72);
    --brown-light: rgba(85, 56, 39, .55);
    --border: rgba(255,235,215,.18);
    --text: #fff8f0;
    --muted: #d8c7b8;
    --accent: #d7a56f;
    --green: #8ed6a0;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    background: #241711;
    overflow-x: hidden;
}

.background {
    position: fixed;
    inset: 0;
    background:
        linear-gradient(
            180deg,
            rgba(35,22,16,.18),
            rgba(35,22,16,.62)
        ),
        url("background.jpg") center / cover no-repeat;
    z-index: -2;
}

.overlay {
    position: fixed;
    inset: 0;
    background:
        linear-gradient(
            120deg,
            rgba(39,24,17,.45),
            rgba(39,24,17,.08),
            rgba(39,24,17,.38)
        );
    z-index: -1;
}

.container {
    width: min(1180px,100%);
    margin: auto;
    padding: 28px 20px 50px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.logo {
    font-size: clamp(27px,4vw,42px);
    font-weight: 750;
    letter-spacing: -1px;
}

.subtitle {
    margin-top: 4px;
    color: var(--muted);
}

.status {
    padding: 9px 15px;
    border: 1px solid var(--border);
    background: var(--brown);
    backdrop-filter: blur(18px);
    border-radius: 999px;
    font-size: 14px;
}

.status-dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    margin-right: 7px;
    background: var(--green);
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(142,214,160,.7);
}

.grid {
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 18px;
}

.card {
    padding: 22px;
    border: 1px solid var(--border);
    border-radius: 24px;
    background: linear-gradient(145deg,var(--brown),var(--brown-light));
    backdrop-filter: blur(18px);
    box-shadow: 0 18px 50px rgba(20,10,5,.25);
}

.card-wide {
    grid-column: 1 / -1;
}

.card-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.card-title h2 {
    margin: 0;
    font-size: 18px;
}

.card-icon {
    font-size: 23px;
}

.rows {
    display: grid;
    gap: 10px;
}

.row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 14px;
    border: 1px solid rgba(255,255,255,.08);
    background: rgba(255,255,255,.055);
    border-radius: 15px;
}

.row-title {
    font-weight: 500;
}

.row-subtitle {
    margin-top: 2px;
    color: var(--muted);
    font-size: 13px;
}

button {
    border: 1px solid rgba(255,255,255,.10);
    color: var(--text);
    background: rgba(255,255,255,.09);
    border-radius: 12px;
    padding: 10px 14px;
    cursor: pointer;
    font-size: 16px;
    transition: .18s ease;
}

button:hover {
    background: rgba(215,165,111,.25);
    transform: translateY(-1px);
}

button:active {
    transform: scale(.96);
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
    transform: none;
}

.button-active {
    color: #ffe3bd;
    background: rgba(215,165,111,.18);
    border-color: rgba(215,165,111,.35);
}

.remote {
   <article class="card">

<div class="card-title">
    <h2>📺 TV 1</h2>
    <span class="row-subtitle">Google TV Stick</span>
</div>

<div class="remote">

<button class="empty">.</button>
<button onclick="tv(1,'up')">▲</button>
<button class="empty">.</button>

<button onclick="tv(1,'left')">◀</button>
<button class="button-active" onclick="tv(1,'ok')">OK</button>
<button onclick="tv(1,'right')">▶</button>

<button class="empty">.</button>
<button onclick="tv(1,'down')">▼</button>
<button class="empty">.</button>

<button onclick="tv(1,'volume_down')">🔉</button>
<button onclick="tv(1,'mute')">🔇</button>
<button onclick="tv(1,'volume_up')">🔊</button>

<button onclick="tv(1,'back')">↩️</button>
<button onclick="tv(1,'home')">🏠</button>
<button onclick="tv(1,'power')">⏻</button>

</div>
</article>


<article class="card">

<div class="card-title">
    <h2>📺 TV 2</h2>
    <span class="row-subtitle">Chromecast</span>
</div>

<div class="remote">

<button class="empty">.</button>
<button disabled>▲</button>
<button class="empty">.</button>

<button disabled>◀</button>
<button disabled>OK</button>
<button disabled>▶</button>

<button class="empty">.</button>
<button disabled>▼</button>
<button class="empty">.</button>

<button disabled>🔉</button>
<button disabled>🔇</button>
<button disabled>🔊</button>

<button disabled>↩️</button>
<button disabled>🏠</button>
<button disabled>⏻</button>

</div>

<div class="row-subtitle" style="margin-top:12px;text-align:center;">
    TV 2 non connectée
</div>

</article>


<article class="card">

<div class="card-title">
    <h2>🌦️ Météo</h2>
    <span class="row-subtitle">Heugas</span>
</div>

<div class="weather-main">

<img id="weatherIcon" class="weather-icon" alt="Météo">

<div>

<div class="temperature">
    <span id="weatherTemp">--</span>
    <span class="accent">°C</span>
</div>

<div id="weatherDescription" class="weather-description">
    Chargement...
</div>

</div>
</div>

<div class="weather-details">

<div class="weather-detail">
    💧
    <br>
    <span id="weatherHumidity">--</span> %
</div>

<div class="weather-detail">
    💨
    <br>
    <span id="weatherWind">--</span> km/h
</div>

<div class="weather-detail">
    🌡️
    <br>
    Ressenti <span id="weatherFeels">--</span> °C
</div>

</div>

</article>


<article class="card">

<div class="card-title">
    <h2>🤖 Palmi</h2>
    <span class="status-dot"></span>
</div>

<div class="subtitle">
    Assistant domotique prêt.
</div>

<br>

<button onclick="loadWeather()">
    ↻ Actualiser
</button>

</article>


<article class="card card-wide">

<div class="card-title">
    <h2>🏠 Maison</h2>
    <span class="row-subtitle">Dashboard V1</span>
</div>

<div class="row">

<div>
    <div class="row-title">État général</div>
    <div class="row-subtitle">Palmi Smart Home</div>
</div>

<span class="accent" id="generalStatusText">
    ● Vérification...
</span>

</div>

</article>

</section>

<div class="footer">
    Palmi Smart Home · 🤎 Interface marron fumé
</div>

</main>

<script>let lightOn = false;
let brightness = 50;


async function loadLightStatus() {

    try {

        const response =
            await fetch("/light/status");

        const data =
            await response.json();

        if (!response.ok || data.success === false) {
            return;
        }

        lightOn = Boolean(data.on);

        if (typeof data.brightness === "number") {
            brightness = data.brightness;
        }

        updateLight();

        document.getElementById("brightness")
            .textContent = brightness + " %";

    } catch (error) {

        console.log(
            "Erreur chargement lumière",
            error
        );
    }
}


async function checkSystemStatus() {

    const dot =
        document.getElementById("headerStatusDot");

    const headerText =
        document.getElementById("headerStatusText");

    const generalText =
        document.getElementById("generalStatusText");

    try {

        const response =
            await fetch("/light/status");

        const data =
            await response.json();

        if (!response.ok || data.success === false) {
            throw new Error("Réponse invalide");
        }

        dot.style.background = "#4ade80";
        headerText.textContent = "Système en ligne";
        generalText.textContent = "● En ligne";
        generalText.style.color = "#4ade80";

    } catch (error) {

        dot.style.background = "#ef4444";
        headerText.textContent = "Système hors ligne";
        generalText.textContent = "● Hors ligne";
        generalText.style.color = "#ef4444";
    }
}


async function toggleLight() {

    const endpoint =
        lightOn
            ? "/light/off"
            : "/light/on";

    try {

        const response =
            await fetch(endpoint);

        const data =
            await response.json();

        if (!response.ok || data.success === false) {

            alert(
                "Impossible de contrôler la lumière."
            );

            return;
        }

        lightOn = !lightOn;
        updateLight();

    } catch (error) {

        alert(
            "Erreur de connexion au serveur."
        );
    }
}


function updateLight() {

    const button =
        document.getElementById("lightButton");

    const state =
        document.getElementById("lightState");

    if (lightOn) {

        button.classList.add("button-active");
        state.textContent = "Allumée";

    } else {

        button.classList.remove("button-active");
        state.textContent = "Éteinte";
    }
}


async function changeBrightness(amount) {

    const oldBrightness = brightness;

    brightness =
        Math.max(
            0,
            Math.min(
                100,
                brightness + amount
            )
        );

    document.getElementById("brightness")
        .textContent = brightness + " %";

    try {

        const response =
            await fetch(
                "/light/brightness",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            brightness
                        })
                }
            );

        const data =
            await response.json();

        if (!response.ok || data.success === false) {

            brightness = oldBrightness;

            document.getElementById("brightness")
                .textContent =
                brightness + " %";
        }

    } catch (error) {

        brightness = oldBrightness;

        document.getElementById("brightness")
            .textContent =
            brightness + " %";

        console.log(
            "Erreur luminosité",
            error
        );
    }
}


// ============================================================
// 📺 TV
// Dashboard → dashboard.js → Worker → KV → A10 → TV Stick
// ============================================================

async function tv(number, action, count = 1) {

    try {

        const response =
            await fetch(
                `/tv/${number}/${action}`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            count
                        })
                }
            );

        const data =
            await response.json();

        if (!response.ok || data.success === false) {

            console.error(
                `TV ${number} → ${action}`,
                data
            );

            return;
        }

        console.log(
            `📺 TV ${number} → ${action} x${count}`,
            data
        );

    } catch (error) {

        console.error(
            `Erreur TV ${number} → ${action}`,
            error
        );
    }
}async function loadWeather() {

    const description =
        document.getElementById(
            "weatherDescription"
        );

    description.textContent =
        "Chargement...";

    try {

        const response =
            await fetch("/weather");

        const data =
            await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.error || "Erreur météo"
            );
        }

        document.getElementById(
            "weatherTemp"
        ).textContent =
            data.temperature;

        document.getElementById(
            "weatherFeels"
        ).textContent =
            data.feelsLike;

        document.getElementById(
            "weatherHumidity"
        ).textContent =
            data.humidity;

        document.getElementById(
            "weatherWind"
        ).textContent =
            data.wind;

        document.getElementById(
            "weatherDescription"
        ).textContent =
            data.description;

        if (data.icon) {

            document.getElementById(
                "weatherIcon"
            ).src =
                `https://openweathermap.org/img/wn/${data.icon}@2x.png`;
        }

    } catch (error) {

        console.error(
            "Erreur météo",
            error
        );

        description.textContent =
            "Météo indisponible";
    }
}


loadWeather();
loadLightStatus();
checkSystemStatus();

setInterval(
    checkSystemStatus,
    30000
);

</script>

</body>
</html>
